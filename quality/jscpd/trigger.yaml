tool: jscpd
language: javascript
language_version: "22"
technique: "Code Quality Auditing"
classification: "Code Duplication Detection"
target_files: [../../src/]
run:
  command: "npx jscpd --min-lines 3 --min-tokens 20 --reporters console src/"
expects:
  duplicate_clone_detected: false
verified_in_session: true
verified_result: "genuinely caught a real clone on first run (resetWidgets() re-declaring the initial widgets array inline, 5 lines / 62 tokens); fixed by extracting a shared INITIAL_WIDGETS constant. Re-run: 0 clones across src/ (4 files, 84 lines, 836 tokens)"
