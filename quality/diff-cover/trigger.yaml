tool: diff-cover
language: javascript
language_version: "22"
technique: "Regression / Coverage Delta"
classification: "Coverage Delta %"
target_files: [../../coverage/cobertura-coverage.xml]
run:
  command: "npx nyc --reporter=cobertura mocha 'test/**/*.test.js' && diff-cover coverage/cobertura-coverage.xml --compare-branch=main"
requirements:
  - diff-cover (Python)
expects:
  diff_coverage_report_generated: true
verified_in_session: true
verified_result: "real diff-coverage report against main: 80% of 10 changed lines covered, 2 missing (the listen() block) in app.js"
